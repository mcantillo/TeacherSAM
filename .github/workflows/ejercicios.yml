name: Verificar ejercicios

# Corre SymPy sobre el banco y registra en verificados.json lo que pase.
# Existe para que la verificación se pueda hacer «en el repositorio»: Cowork no tiene SymPy
# instalado ni salida a internet para instalarlo, así que los ejercicios nuevos que se
# escriban allá se verifican aquí.

on:
  push:
    branches: [main]
    paths:
      - 'recursos/banco/**.py'
      - 'tools/ejercicios.py'
  workflow_dispatch:
    inputs:
      todos:
        description: 'Verificar todo el banco, no solo lo que cambió'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ejercicios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python3 -m pip install --quiet -r tools/requirements.txt

      - name: Verificar
        env:
          ANTES: ${{ github.event.before }}
          TODOS: ${{ inputs.todos }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$TODOS" = "true" ] || [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
            python3 tools/ejercicios.py verificar --todos
          else
            mapfile -t cambiados < <(git diff --name-only --diff-filter=AMR "$ANTES" "$GITHUB_SHA" -- 'recursos/banco/*.py')
            if [ ${#cambiados[@]} -eq 0 ]; then
              echo "No hay archivos del banco nuevos o modificados."
            else
              printf 'Se verificarán %s archivo(s):\n' "${#cambiados[@]}"
              printf '  %s\n' "${cambiados[@]}"
              python3 tools/ejercicios.py verificar "${cambiados[@]}"
            fi
          fi

      - name: Regenerar el catálogo del banco
        if: always()
        # El catálogo deja el banco en un .jsonl legible sin SymPy, para poder escoger
        # ejercicios desde Cowork (allá ni «listar» ni «mostrar» pueden importar el banco).
        run: python3 tools/ejercicios.py catalogo

      - name: Guardar el registro y el catálogo
        # «always()» para guardar lo verificado aunque algún ejercicio falle, pero solo
        # tiene sentido si el repositorio llegó a clonarse.
        if: always() && hashFiles('.git/HEAD') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          rama="${GITHUB_REF_NAME:-main}"
          git add -- recursos/banco/verificados.json recursos/banco/catalogo.jsonl
          if git diff --cached --quiet; then
            echo "Ni el registro ni el catálogo cambiaron."
          else
            git commit -m "Verificar ejercicios y regenerar el catálogo [skip ci]"
            # Los dos workflows escriben en main, así que el push puede llegar tarde y ser
            # rechazado por «non-fast-forward». Antes se reintentaba con «git pull --rebase»,
            # y eso falló el 2026-09-20: rebasar un commit lleno de archivos generados sobre
            # una rama que ya tiene esos mismos archivos da un conflicto «add/add» en cada
            # binario, que nadie puede resolver desde un robot. En vez de rebasar se deshace
            # el commit local, se trae lo último de origin y se vuelve a armar el commit con
            # lo que este trabajo acaba de producir: sin conflictos posibles.
            for intento in 1 2 3; do
              git push && break
              echo "Push rechazado (main se movió). Rehago el commit sobre lo último."
              git fetch origin "$rama" || exit 1
              git reset --mixed FETCH_HEAD # deshace el commit y pone HEAD en lo último
                                           # de origin; el disco no se toca, así que lo
                                           # recién producido sigue ahí para volver a añadirlo
              git add -- recursos/banco/verificados.json recursos/banco/catalogo.jsonl
              if git diff --cached --quiet; then
                echo "Otro trabajo ya subió esto; no hay nada que rehacer."
                break
              fi
              git commit -m "Verificar ejercicios y regenerar el catálogo [skip ci]"
            done
          fi
