name: Compilar PDF

on:
  push:
    branches: [main]
    paths:
      - 'materias/**.tex'
  workflow_dispatch:
    inputs:
      todos:
        description: 'Recompilar todos los .tex de materias/'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pdfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pdfs:
    runs-on: ubuntu-latest
    # Imagen COMPLETA de TeX Live: trae todos los paquetes ya instalados.
    # Antes se usaba latest-minimal y se instalaban a mano con tlmgr, y eso falló dos veces:
    # una porque faltaba txfonts en la lista (2026-09-19) y otra porque el espejo de CTAN
    # estaba más viejo que el contenedor y tlmgr se negó a trabajar (2026-09-20). Con la
    # imagen completa no hay lista que mantener ni espejo del que depender.
    container: texlive/texlive:latest
    steps:
      - name: Instalar git
        run: |
          if command -v git > /dev/null; then
            echo "git ya viene en la imagen: $(git --version)"
            exit 0
          fi
          for intento in 1 2 3; do
            apt-get update -qq && apt-get install -y -qq git > /dev/null && exit 0
            echo "Intento $intento fallido al instalar git; reintento en 15 s."
            sleep 15
          done
          echo "No se pudo instalar git después de 3 intentos."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compilar
        env:
          ANTES: ${{ github.event.before }}
          TODOS: ${{ inputs.todos }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$TODOS" = "true" ] || [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
            bash tools/compilar-pdfs.sh --todos
          else
            bash tools/compilar-pdfs.sh "$ANTES" "$GITHUB_SHA"
          fi

      - name: Subir los PDF al repositorio
        # «always()» para que los PDF que sí compilaron se guarden aunque otro .tex falle,
        # pero solo tiene sentido si el repositorio llegó a clonarse.
        if: always() && hashFiles('.git/HEAD') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # --ignore-removal: nunca se publica el borrado de un PDF. Si un .tex se
          # elimina de verdad, su PDF se quita a mano en ese mismo commit.
          git add --ignore-removal -- 'materias/*.pdf'
          git add -f --ignore-removal -- 'materias/*/guia-didactica/*.aux' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No hay PDF nuevos."
          else
            git commit -m "Compilar PDF [skip ci]"
            # Los dos workflows escriben en main y el de los PDF tarda mucho más: si el
            # otro empuja mientras este compila, el push se rechaza por «non-fast-forward»
            # y el trabajo compilado se pierde. Por eso se reintenta rebasando encima.
            for intento in 1 2 3; do
              git push && break
              echo "Push rechazado (main se movió). Rebaso e intento de nuevo."
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || exit 1
            done
          fi
