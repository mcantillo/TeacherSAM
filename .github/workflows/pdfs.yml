name: Compilar PDF

on:
  push:
    branches: [main]
    paths:
      - 'materias/**.tex'
  workflow_dispatch:
    inputs:
      todos:
        description: 'Recompilar todos los .tex de materias/'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pdfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pdfs:
    runs-on: ubuntu-latest
    # Imagen COMPLETA de TeX Live: trae todos los paquetes ya instalados.
    # Antes se usaba latest-minimal y se instalaban a mano con tlmgr, y eso falló dos veces:
    # una porque faltaba txfonts en la lista (2026-09-19) y otra porque el espejo de CTAN
    # estaba más viejo que el contenedor y tlmgr se negó a trabajar (2026-09-20). Con la
    # imagen completa no hay lista que mantener ni espejo del que depender.
    container: texlive/texlive:latest
    steps:
      - name: Instalar git
        run: |
          if command -v git > /dev/null; then
            echo "git ya viene en la imagen: $(git --version)"
            exit 0
          fi
          for intento in 1 2 3; do
            apt-get update -qq && apt-get install -y -qq git > /dev/null && exit 0
            echo "Intento $intento fallido al instalar git; reintento en 15 s."
            sleep 15
          done
          echo "No se pudo instalar git después de 3 intentos."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compilar
        env:
          ANTES: ${{ github.event.before }}
          TODOS: ${{ inputs.todos }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$TODOS" = "true" ] || [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
            bash tools/compilar-pdfs.sh --todos
          else
            bash tools/compilar-pdfs.sh "$ANTES" "$GITHUB_SHA"
          fi

      - name: Subir los PDF al repositorio
        # «always()» para que los PDF que sí compilaron se guarden aunque otro .tex falle,
        # pero solo tiene sentido si el repositorio llegó a clonarse.
        if: always() && hashFiles('.git/HEAD') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          rama="${GITHUB_REF_NAME:-main}"
          # --ignore-removal: nunca se publica el borrado de un PDF. Si un .tex se
          # elimina de verdad, su PDF se quita a mano en ese mismo commit.
          git add --ignore-removal -- 'materias/*.pdf'
          git add -f --ignore-removal -- 'materias/*/guia-didactica/*.aux' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No hay PDF nuevos."
          else
            git commit -m "Compilar PDF [skip ci]"
            # Los dos workflows escriben en main, así que el push puede llegar tarde y ser
            # rechazado por «non-fast-forward». Antes se reintentaba con «git pull --rebase»,
            # y eso falló el 2026-09-20: rebasar un commit lleno de archivos generados sobre
            # una rama que ya tiene esos mismos archivos da un conflicto «add/add» en cada
            # binario, que nadie puede resolver desde un robot. En vez de rebasar se deshace
            # el commit local, se trae lo último de origin y se vuelve a armar el commit con
            # lo que este trabajo acaba de producir: sin conflictos posibles.
            for intento in 1 2 3; do
              git push && break
              echo "Push rechazado (main se movió). Rehago el commit sobre lo último."
              git fetch origin "$rama" || exit 1
              git reset --mixed FETCH_HEAD # deshace el commit y pone HEAD en lo último
                                           # de origin; el disco no se toca, así que lo
                                           # recién producido sigue ahí para volver a añadirlo
              git add --ignore-removal -- 'materias/*.pdf'
              git add -f --ignore-removal -- 'materias/*/guia-didactica/*.aux' 2>/dev/null || true
              if git diff --cached --quiet; then
                echo "Otro trabajo ya subió esto; no hay nada que rehacer."
                break
              fi
              git commit -m "Compilar PDF [skip ci]"
            done
          fi
